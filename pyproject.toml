

[tool.poetry.dependencies]
python = "^3.9"
openpyxl = "^3.1.5"

[tool.poetry.group.lint.dependencies]
flake8 = "^6.0"
black = "^23.0"
isort = "^5.12"
mypy = "^1.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 119
target-version = ['py39']
exclude = '''      # ЭТО НОВОЕ - не было
/(
    \.git
  | __pycache__
  | \.pytest_cache
)/
'''

[tool.isort]
profile = "black"
line_length = 119
multi_line_output = 3
force_sort_within_sections = true
known_first_party = ["src"]
include_trailing_comma = true

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
exclude = [
    '^venv/',
    '^\.venv/',
    '^\.git/',
]

[tool.poetry]
name = "bank_project"
version = "0.1.0"
description = "Bank project for client operations widget"
authors = ["Student <student@example.com>"]
packages = [{include = "src"}]